[project]
name = "nerd-trader"
version = "0.1.0"
description = "面向加密市场的量化研究与回测工作台"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "xia.jiang", email = "xia.jiang.work@outlook.com" }]

dependencies = [
    "ccxt>=4.5.22,<5",
    "pandas>=2.3.3,<3",
    "python-dotenv>=1.2.1,<2",
    "matplotlib>=3.10.7,<4",
    "pyarrow>=22.0.0,<23",
    "statsmodels>=0.14.5,<1",
    "ta-lib>=0.6.8,<1",
    "plotly>=6.5.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# PyPI 官方源在国内经常超时，默认走清华镜像；如需官方源，改用 --default-index
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
]

[tool.pyright]
# pandas/numpy/ccxt 的 DataFrame 表面无类型信息，unknown/Any 家族一律关掉（它们只会淹没真问题）
typeCheckingMode = "standard"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportAny = "none"
reportImplicitOverride = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 弃用警告直接失败：numpy/pandas 的 timedelta 单位弃用就是这么被抓到的
filterwarnings = ["error"]
