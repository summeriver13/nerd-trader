[project]
name = "nerd-trader"
version = "0.1.0"
description = "面向加密市场的量化研究与回测工作台"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "xia.jiang", email = "xia.jiang.work@outlook.com" }]

dependencies = [
    "ccxt>=4.5.22,<5",
    "pandas>=2.3.3,<3",
    "python-dotenv>=1.2.1,<2",
    "matplotlib>=3.10.7,<4",
    "pyarrow>=22.0.0,<23",
    "statsmodels>=0.14.5,<1",
    "ta-lib>=0.6.8,<1",
    "plotly>=6.5.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# PyPI 官方源在国内经常超时，默认走清华镜像；如需官方源，改用 --default-index
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 规则显式写出来，别靠个人习惯维持；E501 交给 formatter（中文注释按显示宽度看不超行）
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PERF"]
ignore = [
    "E501", # 行长由 ruff format 管
    "B027", # 策略接口的 on_tick/on_bar 等是可选覆写点，故意不标 abstractmethod
]

[tool.pyright]
# pandas/numpy/ccxt 的 DataFrame 表面无类型信息，unknown/Any 家族一律关掉（它们只会淹没真问题）
typeCheckingMode = "standard"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportAny = "none"
# standard 默认关掉、但能抓真 bug 的规则：显式打开
reportUnreachable = "error"           # 不可达代码 = 作者意图与实际不符
reportOptionalSubscript = "error"     # Optional 直接下标（可能崩）
reportOptionalMemberAccess = "error"
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportMissingTypeArgument = "error"
reportImplicitOverride = "error"      # 覆盖基类方法却未标 @override（方法名拼错会静默失效）
reportMissingParameterType = "error"  # 函数签名必须完整标注
reportUnnecessaryComparison = "warning"
reportPrivateUsage = "none"           # 测试直接用模块私有函数
reportUnusedParameter = "none"        # 接口占位参数

[tool.pytest.ini_options]
testpaths = ["tests"]
# 弃用警告直接失败：numpy/pandas 的 timedelta 单位弃用就是这么被抓到的
filterwarnings = ["error"]
